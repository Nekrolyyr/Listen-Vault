# Authelia 4.39 — single-user passkey login for listen.vault.akiba-z.ch
# Secrets come from files (see compose.yaml `secrets:`), never from this file.

theme: auto

server:
  # Portal and API live under https://listen.vault.akiba-z.ch/auth
  address: tcp://0.0.0.0:9091/auth

log:
  level: info

identity_validation:
  reset_password:
    # Password reset by email is not used (no SMTP); the secret is still required.
    jwt_lifespan: 5m

totp:
  disable: true

webauthn:
  disable: false
  # Passwordless sign-in with a passkey. The one_factor policy below lets the passkey alone open the app.
  enable_passkey_login: true
  display_name: Listen Vault
  attestation_conveyance_preference: indirect
  timeout: 60s
  selection_criteria:
    discoverability: required
    user_verification: required

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /var/lib/authelia/users.yml
    watch: false
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    - domain: listen.vault.akiba-z.ch
      policy: one_factor

session:
  name: listen_session
  same_site: lax
  inactivity: 1h
  expiration: 12h
  remember_me: 1M
  cookies:
    - domain: listen.vault.akiba-z.ch
      authelia_url: https://listen.vault.akiba-z.ch/auth
      default_redirection_url: https://listen.vault.akiba-z.ch/

regulation:
  max_retries: 3
  find_time: 2m
  ban_time: 15m

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  # One-time codes (needed to register the first passkey) are written here instead of e-mailed:
  #   /vault/configs/listen-vault/authelia/notification.txt
  filesystem:
    filename: /var/lib/authelia/notification.txt
